name: novacare-ai

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # One-shot: pulls the model into the shared volume, then exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'echo "Pulling ${OLLAMA_MODEL:-qwen3:4b} ..." && ollama pull ${OLLAMA_MODEL:-qwen3:4b} && echo "Model ready."'
    restart: "no"

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - DEMO_DATE=${DEMO_DATE:-2026-09-03}
      - DATABASE_URL=sqlite:////data/novacare.db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      - WEBRTC_STUN_URL=${WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
      - WEBRTC_TURN_URL=${WEBRTC_TURN_URL:-}
      - WEBRTC_TURN_USERNAME=${WEBRTC_TURN_USERNAME:-}
      - WEBRTC_TURN_PASSWORD=${WEBRTC_TURN_PASSWORD:-}
      - VOICE_URL=${NEXT_PUBLIC_VOICE_URL:-http://localhost:8080}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - sqlite_data:/data
      - models_cache:/models_cache
    restart: unless-stopped

  voice:
    build:
      context: .
      dockerfile: docker/voice.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      - WEBRTC_STUN_URL=${WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
      - WEBRTC_TURN_URL=${WEBRTC_TURN_URL:-}
      - WEBRTC_TURN_USERNAME=${WEBRTC_TURN_USERNAME:-}
      - WEBRTC_TURN_PASSWORD=${WEBRTC_TURN_PASSWORD:-}
    volumes:
      - models_cache:/models_cache
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_VOICE_URL: ${NEXT_PUBLIC_VOICE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional self-hosted TURN — enable with: docker compose --profile turn up -d
  coturn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    network_mode: host
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: >
      -c /etc/coturn/turnserver.conf
      --user=${COTURN_USER:-novacare}:${COTURN_PASSWORD:-change-me-please}
      --realm=${COTURN_REALM:-novacare.local}
      ${COTURN_EXTERNAL_IP:+--external-ip=${COTURN_EXTERNAL_IP}}
    restart: unless-stopped

volumes:
  ollama_models:
  chroma_data:
  sqlite_data:
  models_cache:

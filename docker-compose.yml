name: novacare-ai

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEMO_DATE=${DEMO_DATE:-2026-09-03}
      - DATABASE_URL=sqlite:////data/novacare.db
      - GROQ_API_KEY=${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_REASONING_EFFORT=${GROQ_REASONING_EFFORT:-low}
      - CHROMA_HOST=local
      - RAG_PERSIST_DIR=/data/chroma
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      - WEBRTC_STUN_URL=${WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
      - VOICE_URL=${NEXT_PUBLIC_VOICE_URL:-http://localhost:8080}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - sqlite_data:/data
      - models_cache:/models_cache
    restart: unless-stopped

  voice:
    build:
      context: .
      dockerfile: docker/voice.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      - GROQ_TTS_MODEL=${GROQ_TTS_MODEL:-canopylabs/orpheus-v1-english}
      - GROQ_TTS_VOICE=${GROQ_TTS_VOICE:-autumn}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3}
      - STT_LANGUAGE=${STT_LANGUAGE:-}
      - EDGE_VOICE_NE=${EDGE_VOICE_NE:-ne-NP-HemkalaNeural}
      - EDGE_VOICE_EN=${EDGE_VOICE_EN:-en-US-AriaNeural}
      - VAD_STOP_SECS=${VAD_STOP_SECS:-0.6}
      - FILLER_AFTER_SECS=${FILLER_AFTER_SECS:-1.2}
      - EDGE_RATE=${EDGE_RATE:-+0%}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_v3}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      - CALL_API_TOKEN=${CALL_API_TOKEN:-}
      - PUBLIC_VOICE_URL=${PUBLIC_VOICE_URL:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      - WEBRTC_STUN_URL=${WEBRTC_STUN_URL:-stun:stun.l.google.com:19302}
    volumes:
      - models_cache:/models_cache
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_VOICE_URL: ${NEXT_PUBLIC_VOICE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Phone calls: public HTTPS/WSS tunnel to the voice service so Twilio can reach it.
  # Enable with: docker compose --profile phone up -d   (URL is auto-discovered by voice)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["phone"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://voice:8080
    depends_on:
      - voice
    restart: unless-stopped


volumes:
  sqlite_data:
  models_cache:

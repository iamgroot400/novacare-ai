# Minimal coturn config for NovaCare voice NAT traversal.
# Enabled only with:  docker compose --profile turn up -d
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=novacare.local
# user is injected via command in docker-compose from env
no-cli
no-tlsv1
no-tlsv1_1
# Relay range — open these UDP ports on the host firewall for a real deployment
min-port=49152
max-port=49200
log-file=stdout
verbose

# Production stack for the shared EC2 box (t3.small, 2 GB) that also runs Cake Uncle.
# Run from the repo root on the server:  sudo docker compose -f deploy/compose.server.yml up -d
#
# Guards that keep Cake Uncle safe:
# - Ports bind to 127.0.0.1 only (Caddy is the one public entry point); 3000 is Cake Uncle's.
# - mem_limit == memswap_limit: if NovaCare runs out of memory, the kernel kills a NovaCare
#   container, never Cake Uncle's Next.js or PostgreSQL, and NovaCare can't push the box into swap.
# - cpus caps each service so a busy voice call can't starve Cake Uncle of CPU.
# Secrets and per-server settings live in /etc/novacare/novacare.env (root, mode 600).
name: novacare

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: novacare-backend
    env_file: /etc/novacare/novacare.env
    environment:
      - DATABASE_URL=sqlite:////data/novacare.db
      - CHROMA_HOST=local
      - RAG_PERSIST_DIR=/data/chroma
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - sqlite_data:/data
    mem_limit: 576m  # ~370 MB after a knowledge-base turn (ONNX embeddings loaded)
    memswap_limit: 576m
    cpus: 1.0
    restart: unless-stopped

  voice:
    build:
      context: ..
      dockerfile: docker/voice.Dockerfile
    image: novacare-voice
    env_file: /etc/novacare/novacare.env
    environment:
      - BACKEND_URL=http://backend:8000
    # Calls (browser and phone) are websockets through Caddy, so no UDP ports are needed.
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 576m  # ~230 MB idle
    memswap_limit: 576m
    cpus: 1.0
    restart: unless-stopped

  frontend:
    # Built on the laptop by deploy/deploy.sh: `next build` needs more RAM than this box can spare.
    image: novacare-frontend
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 192m  # ~90 MB
    memswap_limit: 192m
    cpus: 0.5
    restart: unless-stopped

volumes:
  sqlite_data:
